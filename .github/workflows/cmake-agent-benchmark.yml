name: CMake Local Agent Benchmark

on:
  workflow_dispatch:
    inputs:
      model_choice:
        description: 'Which model to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - qwen25-coder-7b
          - gemma-4-e4b
          - qwen3-8b
      custom_prompt:
        description: >-
          Custom prompt (blank = default) |
          C escapes: \n \t \r \v \f \a \b \e \xHH \0NNN \\ \" \' |
          (1) Line 1\n\tLine 2 |
          (2) const char *s = "\""; // " |
          (3) char c = '\''; // ' |
          (4) puts("Hi\\n"); // literal \n |
          (5) target_link_libraries(app PRIVATE ${LIBS})
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

env:
  MODEL_RELEASE_TAG: models-v1

jobs:
  # Job 0: Ensure the permanent model-storage release exists
  ensure-model-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create model storage release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$MODEL_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Benchmark GGUF Model Cache ($MODEL_RELEASE_TAG)" \
              --notes "Automated split GGUF model storage for CMake Local Agent Benchmark." \
              --prerelease
          fi

  # Job 1: Cache llama-agent binary (~50MB stays safely in Actions cache)
  prep-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cache llama-agent binary
        uses: actions/cache@v5
        with:
          path: ~/.local/bin
          key: llama-agent-bin-b11604-v2

      - name: Install llama-agent binary (if missing)
        run: |
          if [ ! -x "$HOME/.local/bin/llama-agent" ]; then
            mkdir -p "$HOME/.local/bin" /tmp/llama-extract
            REPO="gary149/llama-agent"
            TAG="b11604"
            FILE="llama-agent-${TAG}-bin-ubuntu-x64.tar.gz"
            wget -O /tmp/llama-agent.tar.gz "$GITHUB_SERVER_URL/${REPO}/releases/download/${TAG}/${FILE}"

            file /tmp/llama-agent.tar.gz | grep -q "gzip compressed data"
            tar -xzf /tmp/llama-agent.tar.gz -C /tmp/llama-extract
            find /tmp/llama-extract -type f \( -name "llama-agent" -o -name "*.so*" \) -exec cp -P {} "$HOME/.local/bin/" \;
            chmod +x "$HOME/.local/bin/llama-agent"
          fi
          "$HOME/.local/bin/llama-agent" --version

  # Job 2: Seed Qwen2.5-Coder-7B into GitHub Release (if missing)
  prep-qwen25-coder-7b:
    needs: ensure-model-release
    if: ${{ inputs.model_choice == 'all' || inputs.model_choice == 'qwen25-coder-7b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Upload Qwen2.5-Coder-7B split parts to Release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          if echo "$ASSETS" | grep -q "^qwen25-coder-7b\.gguf\.partaa$" && echo "$ASSETS" | grep -q "^qwen25-coder-7b\.gguf\.done$"; then
            echo "qwen25-coder-7b already cached in release $MODEL_RELEASE_TAG."
            exit 0
          fi

          mkdir -p /tmp/model-seed
          TARGET="/tmp/model-seed/qwen25-coder-7b.gguf"
          wget -q --show-progress --tries=5 --waitretry=5 -O "$TARGET" \
            "https://huggingface.co"
          [ "$(stat -c%s "$TARGET")" -gt 100000000 ]

          split -b 1900M "$TARGET" "/tmp/model-seed/qwen25-coder-7b.gguf.part"
          rm -f "$TARGET"
          touch "/tmp/model-seed/qwen25-coder-7b.gguf.done"
          gh release upload "$MODEL_RELEASE_TAG" /tmp/model-seed/qwen25-coder-7b.gguf.* --repo "$GITHUB_REPOSITORY" --clobber

  # Job 3: Seed Gemma-4-E4B into GitHub Release (if missing)
  prep-gemma-4-e4b:
    needs: ensure-model-release
    if: ${{ inputs.model_choice == 'all' || inputs.model_choice == 'gemma-4-e4b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Upload Gemma-4-E4B split parts to Release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          if echo "$ASSETS" | grep -q "^gemma-4-e4b\.gguf\.partaa$" && echo "$ASSETS" | grep -q "^gemma-4-e4b\.gguf\.done$"; then
            echo "gemma-4-e4b already cached in release $MODEL_RELEASE_TAG."
            exit 0
          fi

          mkdir -p /tmp/model-seed
          TARGET="/tmp/model-seed/gemma-4-e4b.gguf"
          wget -q --show-progress --tries=5 --waitretry=5 -O "$TARGET" \
            "https://huggingface.co"
          [ "$(stat -c%s "$TARGET")" -gt 100000000 ]

          split -b 1900M "$TARGET" "/tmp/model-seed/gemma-4-e4b.gguf.part"
          rm -f "$TARGET"
          touch "/tmp/model-seed/gemma-4-e4b.gguf.done"
          gh release upload "$MODEL_RELEASE_TAG" /tmp/model-seed/gemma-4-e4b.gguf.* --repo "$GITHUB_REPOSITORY" --clobber

  # Job 4: Seed Qwen3-8B into GitHub Release (if missing)
  prep-qwen3-8b:
    needs: ensure-model-release
    if: ${{ inputs.model_choice == 'all' || inputs.model_choice == 'qwen3-8b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Upload Qwen3-8B split parts to Release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          if echo "$ASSETS" | grep -q "^qwen3-8b\.gguf\.partaa$" && echo "$ASSETS" | grep -q "^qwen3-8b\.gguf\.done$"; then
            echo "qwen3-8b already cached in release $MODEL_RELEASE_TAG."
            exit 0
          fi

          mkdir -p /tmp/model-seed
          TARGET="/tmp/model-seed/qwen3-8b.gguf"
          wget -q --show-progress --tries=5 --waitretry=5 -O "$TARGET" \
            "https://huggingface.co"
          [ "$(stat -c%s "$TARGET")" -gt 100000000 ]

          split -b 1900M "$TARGET" "/tmp/model-seed/qwen3-8b.gguf.part"
          rm -f "$TARGET"
          touch "/tmp/model-seed/qwen3-8b.gguf.done"
          gh release upload "$MODEL_RELEASE_TAG" /tmp/model-seed/qwen3-8b.gguf.* --repo "$GITHUB_REPOSITORY" --clobber

  # Job 5: Gate & build matrix once all parallel prep jobs finish
  prepare:
    if: always()
    needs: [prep-binary, prep-qwen25-coder-7b, prep-gemma-4-e4b, prep-qwen3-8b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Verify required prep jobs succeeded
        run: |
          if [ "${{ needs.prep-binary.result }}" != "success" ]; then
            echo "prep-binary failed"
            exit 1
          fi
          for res in "${{ needs.prep-qwen25-coder-7b.result }}" "${{ needs.prep-gemma-4-e4b.result }}" "${{ needs.prep-qwen3-8b.result }}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "One or more model prep jobs failed"
              exit 1
            fi
          done

      - name: Build dynamic model matrix
        id: set-matrix
        run: |
          CHOICE="${{ inputs.model_choice }}"
          FULL_MATRIX='[
            {"id":"qwen25-coder-7b","MODEL_REPO":"Qwen/Qwen2.5-Coder-7B-Instruct-GGUF","MODEL_FILE":"qwen2.5-coder-7b-instruct-q4_k_m.gguf"},
            {"id":"gemma-4-e4b","MODEL_REPO":"unsloth/gemma-4-E4B-it-GGUF","MODEL_FILE":"gemma-4-E4B-it-UD-Q4_K_XL.gguf"},
            {"id":"qwen3-8b","MODEL_REPO":"Qwen/Qwen3-8B-GGUF","MODEL_FILE":"Qwen3-8B-Q4_K_M.gguf"}
          ]'

          if [ "$CHOICE" = "all" ]; then
            SELECTED=$(echo "$FULL_MATRIX" | jq -c '.')
          else
            SELECTED=$(echo "$FULL_MATRIX" | jq -c --arg id "$CHOICE" '[.[] | select(.id == $id)]')
          fi

          echo "matrix={\"include\":$SELECTED}" >> "$GITHUB_OUTPUT"

  cmake-agent-eval:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      MODEL_REPO: ${{ matrix.MODEL_REPO }}
      MODEL_FILE: ${{ matrix.MODEL_FILE }}
      LLAMA_CACHE: /home/runner/.cache/llama.cpp
      OMP_NUM_THREADS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore llama-agent binary
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/bin
          key: llama-agent-bin-b11604-v2
          fail-on-cache-miss: true

      - name: Restore model GGUF from Release (${{ matrix.id }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.cache/llama.cpp" /tmp/model-parts
          gh release download "$MODEL_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ matrix.id }}.gguf.part*" \
            --dir /tmp/model-parts

          MODEL_PATH="$HOME/.cache/llama.cpp/${MODEL_FILE}"
          cat /tmp/model-parts/${{ matrix.id }}.gguf.part* > "$MODEL_PATH"
          rm -rf /tmp/model-parts

          if [ ! -s "$MODEL_PATH" ] || [ "$(stat -c%s "$MODEL_PATH")" -le 100000000 ]; then
            echo "ERROR: Reassembled model $MODEL_PATH is missing or invalid."
            exit 1
          fi
          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"
          echo "Verified cached model from Release: $MODEL_PATH ($(du -h "$MODEL_PATH" | cut -f1))"

      - name: Configure runtime paths
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/bin:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$HOME/.local/bin/llama-agent" --version

      - name: Ensure CMake & benchmark ignore rules in .gitignore
        run: |
          touch .gitignore
          cat << 'EOF' >> .gitignore

          # CMake & C++ Build Artifacts
          build/
          cmake-build-*/
          CMakeFiles/
          CMakeCache.txt
          cmake_install.cmake
          CTestTestfile.cmake
          Testing/
          Makefile
          *.ninja
          .ninja_deps
          .ninja_log
          compile_commands.json

          # Compiled Objects & Binaries
          *.o
          *.obj
          *.a
          *.lib
          *.so
          *.dylib
          *.dll
          *.exe
          *.out

          # Local Agent & Benchmark Outputs
          .llama-agent/
          agent-output-*.log
          report-*.md
          patch-*.diff
          output-*.html
          EOF
          awk '!seen[$0]++' .gitignore > .gitignore.tmp && mv .gitignore.tmp .gitignore

      - name: Install CMake & C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Run CMake multi-step agent loop (${{ matrix.id }})
        id: run-agent
        continue-on-error: true
        env:
          USER_PROMPT: ${{ inputs.custom_prompt }}
        run: |
          set -o pipefail

          DEFAULT_PROMPT=$(cat << 'EOF' | sed 's/^          //'
          Inspect CMakeLists.txt and the src/ and tests/ directories.
          1. Implement a new C++ module (or feature requested in the issue/spec) and register its source files cleanly in CMakeLists.txt.
          2. Add unit tests covering normal and edge cases and wire them into CTest.
          3. Configure and build the project using: cmake -B build -G Ninja && cmake --build build
          4. Run ctest --test-dir build --output-on-failure and fix any compiler warnings, linker errors, or failing assertions until the build and all tests pass.
          EOF
          )

          DECODED_USER_PROMPT="$(python3 -c '
          import os, re, sys
          raw = os.environ.get("USER_PROMPT", "")
          escapes = {
              "a": "\a", "b": "\b", "e": "\x1b", "f": "\f",
              "n": "\n", "r": "\r", "t": "\t", "v": "\v",
              "\\": "\\", "\"": "\"", "\x27": "\x27", "?": "?"
          }
          pattern = re.compile(r"\\([abefnrtv\\\"\x27?]|x[0-9a-fA-F]{1,2}|[0-7]{1,3})")
          def repl(m):
              tok = m.group(1)
              if tok in escapes:
                  return escapes[tok]
              if tok.startswith("x"):
                  return chr(int(tok[1:], 16))
              return chr(int(tok, 8))
          sys.stdout.write(pattern.sub(repl, raw))
          ')"

          TRIMMED_USER_PROMPT="$(printf '%s' "$DECODED_USER_PROMPT" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          FINAL_PROMPT="${TRIMMED_USER_PROMPT:-$DEFAULT_PROMPT}"
          printf '%s\n' "$FINAL_PROMPT" > /tmp/final-prompt.txt

          printf '%s\n' "$FINAL_PROMPT" | timeout --signal=TERM --kill-after=30s 45m \
            "$HOME/.local/bin/llama-agent" \
            --backend local \
            --offline \
            --yolo \
            --no-session \
            --max-iterations 25 \
            --jinja \
            -m "$MODEL_PATH" \
            --threads 4 \
            --ctx-size 12288 \
            -n 2048 \
            2>&1 | tee "agent-output-${{ matrix.id }}.log"

      - name: Inspect generated files & upload to Gist (${{ matrix.id }})
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          FENCE=$(printf '\x60\x60\x60')
          {
            echo "# Model Evaluation: ${{ matrix.id }}"
            echo "- Repository: ${{ github.repository }}"
            echo "- Model: ${{ matrix.MODEL_REPO }} (${{ matrix.MODEL_FILE }})"
            echo "- Local Cache Path: $MODEL_PATH"
            echo "- Agent Exit Outcome: ${{ steps.run-agent.outcome }}"
            echo ""
            echo "## Prompt Used"
            echo "${FENCE}text"
            cat /tmp/final-prompt.txt 2>/dev/null || echo "(default prompt)"
            echo "${FENCE}"
            echo ""
            echo "## Git Status"
            echo "${FENCE}text"
            git status --short || echo "(no changes)"
            echo "${FENCE}"
            echo "## Diff Stats"
            echo "${FENCE}text"
            git diff --stat || echo "(no modified tracked files)"
            echo "${FENCE}"
            echo "## Modified Files Diff"
            echo "${FENCE}diff"
            git diff || true
            echo "${FENCE}"
            echo "## Newly Generated Files"
            UNTRACKED=$(git ls-files --others --exclude-standard)
            if [ -z "$UNTRACKED" ]; then
              echo "_No new untracked files generated._"
            else
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "### $f"
                echo "${FENCE}cpp"
                cat "$f" || true
                echo ""
                echo "${FENCE}"
              done <<< "$UNTRACKED"
            fi
          } > "report-${{ matrix.id }}.md"

          git add -N . || true
          git diff > "patch-${{ matrix.id }}.diff" || true
          git reset --quiet || true
          touch "agent-output-${{ matrix.id }}.log"

          GIST_URL=""
          if [ -n "$GIST_TOKEN" ]; then
            jq -n \
              --arg desc "CMake Agent Output (${{ matrix.id }}) - ${{ github.repository }} #${{ github.run_number }}" \
              --rawfile log "agent-output-${{ matrix.id }}.log" \
              --rawfile report "report-${{ matrix.id }}.md" \
              --rawfile patch "patch-${{ matrix.id }}.diff" \
              '{
                description: $desc,
                public: false,
                files: {
                  ("1-agent-output-" + "${{ matrix.id }}" + ".log"): { content: (if (log | length) > 0 then log else "(empty log)" end) },
                  ("2-report-" + "${{ matrix.id }}" + ".md"): { content: (if (report | length) > 0 then report else "(empty report)" end) },
                  ("3-patch-" + "${{ matrix.id }}" + ".diff"): { content: (if (patch | length) > 0 then patch else "(no diff generated)" end) }
                }
              }' > /tmp/gist-payload.json

            RESPONSE=$(curl -sS -X POST "$GITHUB_API_URL/gists" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @/tmp/gist-payload.json || true)

            GIST_URL=$(echo "$RESPONSE" | jq -r '.html_url // empty' || true)
            echo "Uploaded Gist: $GIST_URL"
          fi

          {
            echo "## Model Evaluation: ${{ matrix.id }}"
            if [ -n "$GIST_URL" ]; then
              echo "**Full Report & Patch Gist:** [$GIST_URL]($GIST_URL)"
            else
              echo "_Gist upload skipped or failed (check secrets.GIST_TOKEN). Download artifacts below._"
            fi
            echo ""
            echo "### Git Status"
            echo "${FENCE}text"
            git status --short || echo "(no changes)"
            echo "${FENCE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload model evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cmake-eval-${{ matrix.id }}
          path: |
            agent-output-${{ matrix.id }}.log
            report-${{ matrix.id }}.md
            patch-${{ matrix.id }}.diff

      - name: 1. Verify llama-agent execution (${{ matrix.id }})
        if: always()
        run: |
          OUTCOME="${{ steps.run-agent.outcome }}"
          LOG_FILE="agent-output-${{ matrix.id }}.log"
          STATUS="PASSED"
          REASON="llama-agent exited cleanly with valid output."

          if [ "$OUTCOME" != "success" ]; then
            STATUS="FAILED"
            REASON="llama-agent exited with outcome '$OUTCOME' (non-zero exit code or 45m timeout)."
          elif [ ! -s "$LOG_FILE" ]; then
            STATUS="FAILED"
            REASON="agent log file is empty."
          elif grep -qiE "^(llama_model_load: error|segmentation fault|out of memory)" "$LOG_FILE"; then
            STATUS="FAILED"
            REASON="fatal runtime or CLI error detected in $LOG_FILE."
          fi

          echo "Agent Execution (${{ matrix.id }}): $STATUS — $REASON"
          echo "- **1. Agent Execution:** $STATUS ($REASON)" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "PASSED" ]; then
            exit 1
          fi

      - name: 2. Verify CMake configure (${{ matrix.id }})
        if: always()
        run: |
          if cmake -B build -G Ninja; then
            echo "- **2. CMake Configure:** PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **2. CMake Configure:** FAILED (Invalid CMakeLists.txt)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 3. Verify C++ build (${{ matrix.id }})
        if: always()
        run: |
          if cmake --build build; then
            echo "- **3. C++ Build:** PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **3. C++ Build:** FAILED (Compiler or linker errors)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 4. Verify CTest unit tests (${{ matrix.id }})
        if: always()
        run: |
          if ctest --test-dir build --output-on-failure; then
            echo "- **4. CTest Suite:** PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **4. CTest Suite:** FAILED (Unit test assertions failed)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
