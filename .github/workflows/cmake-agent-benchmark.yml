name: CMake Local Agent Benchmark
on:
  workflow_dispatch:
    inputs:
      model_choice:
        description: 'Which model to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - qwen25-coder-7b
          - gemma-4-e4b
          - qwen3-8b

permissions:
  contents: read
  actions: write

jobs:
  # Job 0: Purge ONLY legacy caches from the old prepare setup (preserves new separate caches)
  clean-stale-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete legacy old-prepare caches only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API_HOST="://github.com"
          REPO="${{ github.repository }}"

          CACHE_IDS=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://${API_HOST}/repos/${REPO}/actions/caches?per_page=100" \
            | jq -r '
                .actions_caches[]
                | select(
                    (.key | startswith("llama-agent-all-models-"))
                    or (.key | startswith("llama-agent-qwen"))
                    or (.key | startswith("llama-agent-gemma"))
                  )
                | .id
              ')

          if [ -z "$CACHE_IDS" ]; then
            echo "No legacy old-prepare caches found. New separate caches preserved."
            exit 0
          fi

          for id in $CACHE_IDS; do
            echo "Deleting legacy global Actions cache ID: $id"
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://${API_HOST}/repos/${REPO}/actions/caches/${id}"
          done

  # Job 1: Cache llama-agent binary in parallel
  prep-binary:
    needs: clean-stale-caches
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cache llama-agent binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: llama-agent-bin-b11604-v1

      - name: Install llama-agent binary (if missing)
        run: |
          if [ ! -x "$HOME/.local/bin/llama-agent" ]; then
            mkdir -p "$HOME/.local/bin" /tmp/llama-extract
            HOST="github.com"
            REPO="gary149/llama-agent"
            TAG="b11604"
            FILE="llama-agent-${TAG}-bin-ubuntu-x64.tar.gz"
            wget -O /tmp/llama-agent.tar.gz "https://${HOST}/${REPO}/releases/download/${TAG}/${FILE}"

            file /tmp/llama-agent.tar.gz | grep -q "gzip compressed data"
            tar -xzf /tmp/llama-agent.tar.gz -C /tmp/llama-extract
            find /tmp/llama-extract -type f \( -name "llama-agent" -o -name "*.so*" \) -exec cp -P {} "$HOME/.local/bin/" \;
            chmod +x "$HOME/.local/bin/llama-agent"
          fi
          "$HOME/.local/bin/llama-agent" --version

  # Job 2: Cache Qwen2.5-Coder-7B in parallel
  prep-qwen25-coder-7b:
    needs: clean-stale-caches
    if: ${{ inputs.model_choice == 'all' || inputs.model_choice == 'qwen25-coder-7b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cache Qwen2.5-Coder-7B model
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp/Qwen_Qwen2.5-Coder-7B-Instruct-GGUF_qwen2.5-coder-7b-instruct-q4_k_m.gguf
          key: gguf-qwen25-coder-7b-v1

      - name: Download Qwen2.5-Coder-7B (if missing)
        run: |
          TARGET="$HOME/.cache/llama.cpp/Qwen_Qwen2.5-Coder-7B-Instruct-GGUF_qwen2.5-coder-7b-instruct-q4_k_m.gguf"
          if [ ! -f "$TARGET" ]; then
            mkdir -p "$HOME/.cache/llama.cpp"
            HF_HOST="huggingface.co"
            wget -q --show-progress -O "$TARGET" \
              "https://${HF_HOST}/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
          fi

  # Job 3: Cache Gemma-4-E4B in parallel
  prep-gemma-4-e4b:
    needs: clean-stale-caches
    if: ${{ inputs.model_choice == 'all' || inputs.model_choice == 'gemma-4-e4b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cache Gemma-4-E4B model
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp/unsloth_gemma-4-E4B-it-GGUF_gemma-4-E4B-it-UD-Q4_K_XL.gguf
          key: gguf-gemma-4-e4b-v1

      - name: Download Gemma-4-E4B (if missing)
        run: |
          TARGET="$HOME/.cache/llama.cpp/unsloth_gemma-4-E4B-it-GGUF_gemma-4-E4B-it-UD-Q4_K_XL.gguf"
          if [ ! -f "$TARGET" ]; then
            mkdir -p "$HOME/.cache/llama.cpp"
            HF_HOST="huggingface.co"
            wget -q --show-progress -O "$TARGET" \
              "https://${HF_HOST}/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-UD-Q4_K_XL.gguf"
          fi

  # Job 4: Cache Qwen3-8B in parallel
  prep-qwen3-8b:
    needs: clean-stale-caches
    if: ${{ inputs.model_choice == 'all' || inputs.model_choice == 'qwen3-8b' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Cache Qwen3-8B model
        uses: actions/cache@v4
        with:
          path: ~/.cache/llama.cpp/Qwen_Qwen3-8B-GGUF_Qwen3-8B-Q4_K_M.gguf
          key: gguf-qwen3-8b-v1

      - name: Download Qwen3-8B (if missing)
        run: |
          TARGET="$HOME/.cache/llama.cpp/Qwen_Qwen3-8B-GGUF_Qwen3-8B-Q4_K_M.gguf"
          if [ ! -f "$TARGET" ]; then
            mkdir -p "$HOME/.cache/llama.cpp"
            HF_HOST="huggingface.co"
            wget -q --show-progress -O "$TARGET" \
              "https://${HF_HOST}/Qwen/Qwen3-8B-GGUF/resolve/main/Qwen3-8B-Q4_K_M.gguf"
          fi

  # Job 5: Gate & build matrix once all parallel prep jobs finish
  prepare:
    if: always()
    needs: [prep-binary, prep-qwen25-coder-7b, prep-gemma-4-e4b, prep-qwen3-8b]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Verify required prep jobs succeeded
        run: |
          if [ "${{ needs.prep-binary.result }}" != "success" ]; then
            echo "prep-binary failed"
            exit 1
          fi
          for res in "${{ needs.prep-qwen25-coder-7b.result }}" "${{ needs.prep-gemma-4-e4b.result }}" "${{ needs.prep-qwen3-8b.result }}"; do
            if [ "$res" = "failure" ] || [ "$res" = "cancelled" ]; then
              echo "One or more model prep jobs failed"
              exit 1
            fi
          done

      - name: Build dynamic model matrix
        id: set-matrix
        run: |
          CHOICE="${{ inputs.model_choice }}"
          FULL_MATRIX='[
            {"id":"qwen25-coder-7b","MODEL_REPO":"Qwen/Qwen2.5-Coder-7B-Instruct-GGUF","MODEL_FILE":"qwen2.5-coder-7b-instruct-q4_k_m.gguf"},
            {"id":"gemma-4-e4b","MODEL_REPO":"unsloth/gemma-4-E4B-it-GGUF","MODEL_FILE":"gemma-4-E4B-it-UD-Q4_K_XL.gguf"},
            {"id":"qwen3-8b","MODEL_REPO":"Qwen/Qwen3-8B-GGUF","MODEL_FILE":"Qwen3-8B-Q4_K_M.gguf"}
          ]'

          if [ "$CHOICE" = "all" ]; then
            SELECTED=$(echo "$FULL_MATRIX" | jq -c '.')
          else
            SELECTED=$(echo "$FULL_MATRIX" | jq -c --arg id "$CHOICE" '[.[] | select(.id == $id)]')
          fi

          echo "matrix={\"include\":$SELECTED}" >> "$GITHUB_OUTPUT"

  cmake-agent-eval:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      MODEL_REPO: ${{ matrix.MODEL_REPO }}
      MODEL_FILE: ${{ matrix.MODEL_FILE }}
      OMP_NUM_THREADS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore llama-agent binary
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/bin
          key: llama-agent-bin-b11604-v1

      - name: Restore model GGUF (${{ matrix.id }})
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/llama.cpp
          key: gguf-${{ matrix.id }}-v1

      - name: Configure runtime paths
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/bin:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$HOME/.local/bin/llama-agent" --version

      - name: Ensure CMake & benchmark ignore rules in .gitignore
        run: |
          touch .gitignore
          cat << 'EOF' >> .gitignore

          # CMake & C++ Build Artifacts
          build/
          cmake-build-*/
          CMakeFiles/
          CMakeCache.txt
          cmake_install.cmake
          CTestTestfile.cmake
          Testing/
          Makefile
          *.ninja
          .ninja_deps
          .ninja_log
          compile_commands.json

          # Compiled Objects & Binaries
          *.o
          *.obj
          *.a
          *.lib
          *.so
          *.dylib
          *.dll
          *.exe
          *.out

          # Local Agent & Benchmark Outputs
          .llama-agent/
          agent-output-*.log
          report-*.md
          patch-*.diff
          output-*.html
          EOF
          awk '!seen[$0]++' .gitignore > .gitignore.tmp && mv .gitignore.tmp .gitignore

      - name: Install CMake & C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Run CMake multi-step agent loop (${{ matrix.id }})
        id: run-agent
        continue-on-error: true
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 45m \
            "$HOME/.local/bin/llama-agent" \
            --hf-repo "$MODEL_REPO" \
            --hf-file "$MODEL_FILE" \
            --threads 4 \
            --ctx-size 12288 \
            --max-turns 12 \
            -p "Inspect CMakeLists.txt and the src/ and tests/ directories.
            1. Implement a new C++ module (or feature requested in the issue/spec) and register its source files cleanly in CMakeLists.txt.
            2. Add unit tests covering normal and edge cases and wire them into CTest.
            3. Configure and build the project using: cmake -B build -G Ninja && cmake --build build
            4. Run ctest --test-dir build --output-on-failure and fix any compiler warnings, linker errors, or failing assertions until the build and all tests pass." \
            2>&1 | tee "agent-output-${{ matrix.id }}.log"

      - name: Inspect generated files & upload to Gist (${{ matrix.id }})
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          FENCE='```'
          {
            echo "# Model Evaluation: ${{ matrix.id }}"
            echo "- Repository: ${{ github.repository }}"
            echo "- Model: ${{ matrix.MODEL_REPO }} (${{ matrix.MODEL_FILE }})"
            echo "- Agent Exit Outcome: ${{ steps.run-agent.outcome }}"
            echo ""
            echo "## Git Status"
            echo "${FENCE}text"
            git status --short || echo "(no changes)"
            echo "${FENCE}"
            echo "## Diff Stats"
            echo "${FENCE}text"
            git diff --stat || echo "(no modified tracked files)"
            echo "${FENCE}"
            echo "## Modified Files Diff"
            echo "${FENCE}diff"
            git diff
            echo "${FENCE}"
            echo "## Newly Generated Files"
            UNTRACKED=$(git ls-files --others --exclude-standard)
            if [ -z "$UNTRACKED" ]; then
              echo "_No new untracked files generated._"
            else
              for f in $UNTRACKED; do
                echo "### $f"
                echo "${FENCE}cpp"
                cat "$f"
                echo ""
                echo "${FENCE}"
              done
            fi
          } > "report-${{ matrix.id }}.md"

          git add -N .
          git diff > "patch-${{ matrix.id }}.diff"
          touch "agent-output-${{ matrix.id }}.log"

          GIST_URL=""
          if [ -n "$GIST_TOKEN" ]; then
            jq -n \
              --arg desc "CMake Agent Output (${{ matrix.id }}) - ${{ github.repository }} #${{ github.run_number }}" \
              --rawfile log "agent-output-${{ matrix.id }}.log" \
              --rawfile report "report-${{ matrix.id }}.md" \
              --rawfile patch "patch-${{ matrix.id }}.diff" \
              '{
                description: $desc,
                public: false,
                files: {
                  ("1-agent-output-" + "${{ matrix.id }}" + ".log"): { content: (if (log | length) > 0 then log else "(empty log)" end) },
                  ("2-report-" + "${{ matrix.id }}" + ".md"): { content: (if (report | length) > 0 then report else "(empty report)" end) },
                  ("3-patch-" + "${{ matrix.id }}" + ".diff"): { content: (if (patch | length) > 0 then patch else "(no diff generated)" end) }
                }
              }' > /tmp/gist-payload.json

            API_HOST="://github.com"
            RESPONSE=$(curl -sS -X POST "https://${API_HOST}/gists" \
              -H "Authorization: Bearer $GIST_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @/tmp/gist-payload.json)

            GIST_URL=$(echo "$RESPONSE" | jq -r '.html_url // empty')
            echo "Uploaded Gist: $GIST_URL"
          fi

          {
            echo "## Model Evaluation: ${{ matrix.id }}"
            if [ -n "$GIST_URL" ]; then
              echo "**Full Report & Patch Gist:** [$GIST_URL]($GIST_URL)"
            else
              echo "_Gist upload skipped (set secrets.GIST_TOKEN to enable). Download artifacts below._"
            fi
            echo ""
            echo "### Git Status"
            echo "${FENCE}text"
            git status --short || echo "(no changes)"
            echo "${FENCE}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.run-agent.outcome }}" != "success" ]; then
            exit 1
          fi

      - name: Upload model evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-eval-${{ matrix.id }}
          path: |
            agent-output-${{ matrix.id }}.log
            report-${{ matrix.id }}.md
            patch-${{ matrix.id }}.diff
