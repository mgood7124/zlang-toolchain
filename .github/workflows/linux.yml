# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install and Setup Ollama and GH CLI
      run: |
        # Install Ollama and GH CLI
        curl -fsSL https://ollama.com/install.sh | sh
        curl -sS https://webi.sh/gh | sh
        export PATH="$HOME/.local/bin:$PATH"

        export GITHUB_TOKEN=
        echo ${{ github.token }} | gh auth login --with-token

        # Start ollama with nohup, stander and error log write to ollama.log
        nohup ollama serve > ollama.log 2>&1 &

        # Wait ollama serve as a service
        for times in {1..10}; do
          if curl -s http://127.0.0.1:11434/ | grep "Ollama is running"; then
            echo "Ollama is ready to serve."

            # pull model
            echo "start to pull model:${{ env.model }}"
            ollama pull ${{ env.model }}
            ollama list
            exit 0
          fi
          echo "Waiting for ollama to start"
          sleep 3
        done
        echo "Fail to start ollama as a service"
        exit 1
      shell: bash

      name: generate a cmake project
      env: 
        GITHUB_TOKEN: ${{ github.token }}
        model: codellama
      run: |
          PROMPT="generate a cmake project for C++"
          curl -s http://127.0.0.1:11434/api/generate -d '{"model": "${{ env.model }}", "prompt": "${PROMPT}.:\n\n```\n'""'\n```", "stream": false}' | jq -r '.response'

          gh pr comment ${{ github.event.pull_request.number }} --body "${comments}"
        done
      shell: bash
