# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    env:
      LLAMA_TAG: b11535
      MODEL_REPO: ggml-org/Qwen3-1.7B-GGUF
      MODEL_FILE: Qwen3-1.7B-Q4_K_M.gguf

    steps:
      - uses: actions/checkout@v4

      - name: Cache llama.cpp + model
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            llama-bin
            models
          key: llama-${{ env.LLAMA_TAG }}-${{ env.MODEL_FILE }}

      - name: Fetch llama.cpp binaries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p llama-bin
          curl -sL -o /tmp/llama.tar.gz \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          tar xzf /tmp/llama.tar.gz -C llama-bin --strip-components=1
      - name: Fetch model
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -sL -o "models/${MODEL_FILE}" \
            "https://huggingface.co/${MODEL_REPO}/resolve/main/${MODEL_FILE}"

      - name: Run inference
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/llama-bin
          PROMPT: ${{ 'generate a C++ cmake project.' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "running llama using $(nproc) threads"
          ./llama-bin/llama-cli \
            -m "models/${MODEL_FILE}" \
            -p "$PROMPT" \
            -n 6400 \
            -t $(nproc) \
            --no-warmup 2>&1 | tee /tmp/out.txt
          echo "### Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/out.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
