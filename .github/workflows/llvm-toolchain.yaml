name: Incremental Full LLVM + Clang + LLD + LLDB + Runtimes Builder

on:
  workflow_dispatch:
    inputs:
      model_choice:
        description: 'Model to run (Recommended: gemma-4-e4b — fastest & highest success rate on 4 vCPUs)'
        required: true
        default: 'gemma-4-e4b'
        type: choice
        options:
          - 'gemma-4-e4b'
          - 'qwen35-9b'
          - 'qwen3-8b'
          - 'qwen3-4b-instruct-2507'
      target_suite:
        description: 'Target OS & ABI suite (default: all — 11 targets across Linux, Windows, macOS & Android x86/ARM)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'linux-all'
          - 'linux-x86_64'
          - 'linux-arm64'
          - 'linux-armhf'
          - 'windows-all'
          - 'windows-x86_64'
          - 'windows-arm64'
          - 'macos-all'
          - 'macos-arm64'
          - 'macos-x86_64'
          - 'android-all'
          - 'android-arm64-v8a'
          - 'android-armeabi-v7a'
          - 'android-x86_64'
          - 'android-x86'
      android_api:
        description: 'Android minimum API level (used for Android targets)'
        required: false
        default: '24'
        type: string
      ndk_version:
        description: 'Android NDK version tag (e.g. r28c or r29 — ships modern Clang for LLVM 23)'
        required: false
        default: 'r29c'
        type: string
      llvm_tag:
        description: 'LLVM monorepo git tag'
        required: false
        default: 'llvmorg-23.1.0'
        type: string
      llvm_targets:
        description: 'LLVM CPU backends (X86=32/64-bit Intel & AMD, ARM=32-bit ARM, AArch64=64-bit ARM, Mips=32/64-bit MIPS)'
        required: false
        default: 'X86;ARM;AArch64;Mips'
        type: string
      custom_prompt:
        description: 'Optional custom instructions (overrides default full toolchain build prompt)'
        required: false
        default: ''
        type: string
      slice:
        description: 'Continuation slice number (leave at 1 when starting)'
        required: false
        default: '1'
        type: string
      max_slices:
        description: 'Hard ceiling on continuation slices per OS/ABI (anti-loop guard)'
        required: false
        default: '12'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: incremental-llvm-suite-${{ github.ref }}-${{ inputs.target_suite }}
  cancel-in-progress: false

env:
  LLAMA_AGENT_TAG: b1094
  MODEL_RELEASE_TAG: models-v1
  DEPS_RELEASE_TAG: deps-prebuilt-v1
  LLAMA_CACHE: /home/runner/.cache/llama.cpp
  PREBUILT_PREFIX: /home/runner/.cache/prebuilt-deps
  XWIN_DIR: /home/runner/.cache/xwin
  ANDROID_NDK_HOME: /home/runner/.cache/android-ndk
  MACOS_SDK_DIR: /home/runner/.cache/macos-sdk/MacOSX.sdk
  CCACHE_DIR: /home/runner/.cache/ccache
  CCACHE_MAXSIZE: 8G
  OMP_NUM_THREADS: 4
  CC: clang
  CXX: clang++
  LDFLAGS: -fuse-ld=lld

jobs:
  # Job 0A: Expand target_suite into concrete OS/ABI matrix entries
  prepare-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      needs_macos: ${{ steps.set-matrix.outputs.needs_macos }}
    steps:
      - name: Build target OS/ABI matrix
        id: set-matrix
        run: |
          SUITE="${{ inputs.target_suite }}"
          ALL_JSON='[
            {"suite_id":"linux-x86_64","target_os":"linux","arch":"x86_64"},
            {"suite_id":"linux-arm64","target_os":"linux-arm","arch":"aarch64"},
            {"suite_id":"linux-armhf","target_os":"linux-arm","arch":"armhf"},
            {"suite_id":"windows-x86_64","target_os":"windows-xwin","arch":"x86_64"},
            {"suite_id":"windows-arm64","target_os":"windows-xwin","arch":"aarch64"},
            {"suite_id":"macos-arm64","target_os":"macos","arch":"arm64"},
            {"suite_id":"macos-x86_64","target_os":"macos","arch":"x86_64"},
            {"suite_id":"android-arm64-v8a","target_os":"android-ndk","arch":"arm64-v8a"},
            {"suite_id":"android-armeabi-v7a","target_os":"android-ndk","arch":"armeabi-v7a"},
            {"suite_id":"android-x86_64","target_os":"android-ndk","arch":"x86_64"},
            {"suite_id":"android-x86","target_os":"android-ndk","arch":"x86"}
          ]'

          case "$SUITE" in
            all)
              MATRIX=$(echo "$ALL_JSON" | jq -c '.')
              ;;
            linux-all)
              MATRIX=$(echo "$ALL_JSON" | jq -c '[.[] | select(.target_os == "linux" or .target_os == "linux-arm")]')
              ;;
            windows-all)
              MATRIX=$(echo "$ALL_JSON" | jq -c '[.[] | select(.target_os == "windows-xwin")]')
              ;;
            macos-all)
              MATRIX=$(echo "$ALL_JSON" | jq -c '[.[] | select(.target_os == "macos")]')
              ;;
            android-all)
              MATRIX=$(echo "$ALL_JSON" | jq -c '[.[] | select(.target_os == "android-ndk")]')
              ;;
            *)
              MATRIX=$(echo "$ALL_JSON" | jq -c --arg s "$SUITE" '[.[] | select(.suite_id == $s)]')
              ;;
          esac

          NEEDS_MACOS=$(echo "$MATRIX" | jq -r 'any(.[]; .target_os == "macos")')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "needs_macos=$NEEDS_MACOS" >> "$GITHUB_OUTPUT"

  # Job 0B: Extract & cache MacOSX.sdk on macos-latest whenever any macOS target is included
  prep-macos-sdk:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.needs_macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Cache MacOSX.sdk sysroot
        id: cache-macos-sdk
        uses: actions/cache@v5
        with:
          path: /Users/runner/.cache/macos-sdk
          key: macos-sdk-sysroot-v1

      - name: Extract MacOSX.sdk from Xcode (on cache miss)
        if: steps.cache-macos-sdk.outputs.cache-hit != 'true'
        run: |
          SDK_SRC="$(xcrun --show-sdk-path)"
          echo "Packaging MacOSX.sdk from: $SDK_SRC"
          mkdir -p /Users/runner/.cache/macos-sdk
          # Preserve relative symlinks (-a) so self-referential framework links (e.g. Ruby.framework) do not cycle
          rsync -a "$SDK_SRC/" /Users/runner/.cache/macos-sdk/MacOSX.sdk/
          du -sh /Users/runner/.cache/macos-sdk/MacOSX.sdk

  # Job 1: Parallel matrix builder across all selected OSes & ABIs on 16GB Linux VMs
  incremental-build:
    needs: [prepare-matrix, prep-macos-sdk]
    if: always() && needs.prepare-matrix.result == 'success' && (needs.prep-macos-sdk.result == 'success' || needs.prep-macos-sdk.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve model & target key configuration
        id: model
        run: |
          case "${{ inputs.model_choice }}" in
            qwen35-9b)
              echo "repo=unsloth/Qwen3.5-9B-GGUF" >> "$GITHUB_OUTPUT"
              echo "file=Qwen3.5-9B-Q4_K_M.gguf" >> "$GITHUB_OUTPUT"
              echo "ctx=32768" >> "$GITHUB_OUTPUT"
              ;;
            qwen3-4b-instruct-2507)
              echo "repo=unsloth/Qwen3-4B-Instruct-2507-GGUF" >> "$GITHUB_OUTPUT"
              echo "file=Qwen3-4B-Instruct-2507-Q4_K_M.gguf" >> "$GITHUB_OUTPUT"
              echo "ctx=32768" >> "$GITHUB_OUTPUT"
              ;;
            qwen3-8b)
              echo "repo=Qwen/Qwen3-8B-GGUF" >> "$GITHUB_OUTPUT"
              echo "file=Qwen3-8B-Q4_K_M.gguf" >> "$GITHUB_OUTPUT"
              echo "ctx=32768" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "repo=unsloth/gemma-4-E4B-it-GGUF" >> "$GITHUB_OUTPUT"
              echo "file=gemma-4-E4B-it-UD-Q4_K_XL.gguf" >> "$GITHUB_OUTPUT"
              echo "ctx=32768" >> "$GITHUB_OUTPUT"
              ;;
          esac

          echo "key_prefix=llvm-suite-full-${{ matrix.suite_id }}" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        uses: actions/cache@v5
        with:
          path: /tmp/apt-debs
          key: apt-cmake-ninja-clang22-arm-lldb-ccache-v1

      - name: Install Clang 22, LLD 22, Linux ARM cross-sysroots, CMake, Ninja & ccache
        run: |
          mkdir -p /tmp/apt-debs
          if ! command -v clang-22 >/dev/null 2>&1 || ! command -v lld-link-22 >/dev/null 2>&1; then
            curl -fsSL https://llvm.org | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://llvm.org llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
            sudo apt-get update
            sudo apt-get install -y -o Dir::Cache::archives="/tmp/apt-debs" \
              cmake ninja-build clang-22 llvm-22 lld-22 swig python3-dev libxml2-dev libedit-dev ccache time unzip
          fi

          if [ "${{ matrix.target_os }}" = "linux-arm" ]; then
            sudo apt-get update
            sudo apt-get install -y -o Dir::Cache::archives="/tmp/apt-debs" \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

          for tool in clang clang++ lld lld-link ld.lld ld64.lld llvm-lib llvm-rc llvm-ar llvm-ranlib llvm-strip; do
            if [ -x "/usr/bin/${tool}-22" ]; then
              sudo ln -sf "/usr/bin/${tool}-22" "/usr/local/bin/${tool}"
            fi
          done
          clang --version

      - name: Generate CMake Linux ARM cross-compile toolchain file (linux-arm only)
        if: matrix.target_os == 'linux-arm'
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            TRIPLE="aarch64-linux-gnu"
            PROC="aarch64"
          else
            TRIPLE="arm-linux-gnueabihf"
            PROC="armv7l"
          fi
          cat << EOF > /tmp/linux-arm-toolchain.cmake
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ${PROC})
          set(CMAKE_C_COMPILER /usr/local/bin/clang)
          set(CMAKE_CXX_COMPILER /usr/local/bin/clang++)
          set(CMAKE_C_COMPILER_TARGET ${TRIPLE})
          set(CMAKE_CXX_COMPILER_TARGET ${TRIPLE})
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-fuse-ld=lld --target=${TRIPLE}")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-fuse-ld=lld --target=${TRIPLE}")
          set(CMAKE_FIND_ROOT_PATH "/usr/${TRIPLE};${PREBUILT_PREFIX}")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Cache xwin Windows SDK + MSVC CRT sysroot (x64 + ARM64, windows-xwin only)
        if: matrix.target_os == 'windows-xwin'
        id: cache-xwin
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/xwin
          key: xwin-msvc-sdk-multiarch-v1

      - name: Setup xwin Windows SDK + MSVC CRT sysroot (x64 + ARM64, windows-xwin only)
        if: matrix.target_os == 'windows-xwin' && steps.cache-xwin.outputs.cache-hit != 'true'
        run: |
          XWIN_VER="0.6.7"
          curl -fsSL "https://github.com{XWIN_VER}/xwin-${XWIN_VER}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/xwin.tar.gz
          tar -xzf /tmp/xwin.tar.gz -C /tmp
          "/tmp/xwin-${XWIN_VER}-x86_64-unknown-linux-musl/xwin" --accept-license --arch x86_64,aarch64 splat --output "$XWIN_DIR"
          rm -rf /tmp/xwin*

      - name: Generate CMake Windows MSVC cross-compile toolchain file (x86_64 or aarch64)
        if: matrix.target_os == 'windows-xwin'
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            WIN_PROC="ARM64"
            WIN_TRIPLE="aarch64-pc-windows-msvc"
          else
            WIN_PROC="AMD64"
            WIN_TRIPLE="x86_64-pc-windows-msvc"
          fi
          cat << EOF > /tmp/windows-msvc-toolchain.cmake
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR ${WIN_PROC})
          set(CMAKE_C_COMPILER /usr/local/bin/clang)
          set(CMAKE_CXX_COMPILER /usr/local/bin/clang++)
          set(CMAKE_LINKER /usr/local/bin/lld-link)
          set(CMAKE_AR /usr/local/bin/llvm-lib)
          set(CMAKE_RC_COMPILER /usr/local/bin/llvm-rc)
          set(CMAKE_C_COMPILER_TARGET ${WIN_TRIPLE})
          set(CMAKE_CXX_COMPILER_TARGET ${WIN_TRIPLE})
          set(CMAKE_C_FLAGS_INIT "-winsysroot ${XWIN_DIR}")
          set(CMAKE_CXX_FLAGS_INIT "-winsysroot ${XWIN_DIR}")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-winsysroot:${XWIN_DIR}")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-winsysroot:${XWIN_DIR}")
          set(CMAKE_FIND_ROOT_PATH "${PREBUILT_PREFIX}")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Restore cached MacOSX.sdk sysroot (macos only)
        if: matrix.target_os == 'macos'
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/macos-sdk
          key: macos-sdk-sysroot-v1

      - name: Generate CMake macOS Darwin cross-compile toolchain file (macos only)
        if: matrix.target_os == 'macos'
        run: |
          ARCH="${{ matrix.arch }}"
          TRIPLE="${ARCH}-apple-darwin23.0"
          cat << EOF > /tmp/macos-darwin-toolchain.cmake
          set(CMAKE_SYSTEM_NAME Darwin)
          set(CMAKE_SYSTEM_PROCESSOR ${ARCH})
          set(CMAKE_OSX_ARCHITECTURES ${ARCH})
          set(CMAKE_OSX_DEPLOYMENT_TARGET "13.0")
          set(CMAKE_OSX_SYSROOT "${MACOS_SDK_DIR}")
          set(CMAKE_C_COMPILER /usr/local/bin/clang)
          set(CMAKE_CXX_COMPILER /usr/local/bin/clang++)
          set(CMAKE_AR /usr/local/bin/llvm-ar)
          set(CMAKE_RANLIB /usr/local/bin/llvm-ranlib)
          set(CMAKE_STRIP /usr/local/bin/llvm-strip)
          set(CMAKE_C_COMPILER_TARGET ${TRIPLE})
          set(CMAKE_CXX_COMPILER_TARGET ${TRIPLE})
          set(CMAKE_C_FLAGS_INIT "-isysroot ${MACOS_SDK_DIR} -mmacosx-version-min=13.0")
          set(CMAKE_CXX_FLAGS_INIT "-isysroot ${MACOS_SDK_DIR} -mmacosx-version-min=13.0")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-fuse-ld=lld -isysroot ${MACOS_SDK_DIR} -mmacosx-version-min=13.0")
          set(CMAKE_SHARED_LINKER_FLAGS_INIT "-fuse-ld=lld -isysroot ${MACOS_SDK_DIR} -mmacosx-version-min=13.0")
          set(CMAKE_FIND_ROOT_PATH "${MACOS_SDK_DIR};${PREBUILT_PREFIX}")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

      - name: Cache Android NDK (android-ndk only)
        if: matrix.target_os == 'android-ndk'
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/android-ndk
          key: android-ndk-${{ inputs.ndk_version }}-linux-v1

      - name: Download & unpack Android NDK (android-ndk only)
        if: matrix.target_os == 'android-ndk' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_VER="${{ inputs.ndk_version }}"
          curl -fsSL "https://google.com{NDK_VER}-linux.zip" -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d /tmp/ndk-extract
          rm -rf "$ANDROID_NDK_HOME"
          mv "/tmp/ndk-extract/android-ndk-${NDK_VER}" "$ANDROID_NDK_HOME"
          rm -rf /tmp/android-ndk.zip /tmp/ndk-extract
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Restore Actions cache for llama-agent binary
        id: cache-agent-bin
        uses: actions/cache@v5
        with:
          path: ~/.local/bin
          key: llama-agent-bin-${{ env.LLAMA_AGENT_TAG }}-v2

      - name: Install or seed llama-agent binary (matching benchmark workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -x "$HOME/.local/bin/llama-agent" ]; then
            REPO="gary149/llama-agent"
            SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
            API_URL="${GITHUB_API_URL:-https://github.com}"
            ASSET_NAME="llama-agent-$LLAMA_AGENT_TAG-bin-ubuntu-x64.tar.gz"
            mkdir -p "$HOME/.local/bin" /tmp/llama-extract

            if ! gh release view "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$MODEL_RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Cached Llama Agent & Quantized GGUF Models" \
                --notes "Pre-cached llama-agent binary and split GGUF model weights." \
                --prerelease
            fi

            ASSETS=$(gh release view "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
            if ! echo "$ASSETS" | grep -qx "$ASSET_NAME"; then
              DIRECT_URL="$SERVER_URL/$REPO/releases/download/$LLAMA_AGENT_TAG/$ASSET_NAME"
              if ! wget --server-response -O "/tmp/$ASSET_NAME" "$DIRECT_URL" 2>&1; then
                LATEST_URL=$(curl -fsSL "$API_URL/repos/$REPO/releases" | jq -r '[.[].assets[] | select(.name | test("(ubuntu|linux).*x64.*\\.(tar\\.gz|zip)$"; "i"))].browser_download_url // empty')
                [ -n "$LATEST_URL" ] || { echo "ERROR: No Linux x64 release asset found on $REPO"; exit 1; }
                wget -O "/tmp/$ASSET_NAME" "$LATEST_URL"
              fi
              gh release upload "$MODEL_RELEASE_TAG" "/tmp/$ASSET_NAME" --repo "$GITHUB_REPOSITORY" --clobber || true
            else
              gh release download "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --dir /tmp
            fi

            if file "/tmp/$ASSET_NAME" | grep -q "Zip archive"; then
              unzip -q "/tmp/$ASSET_NAME" -d /tmp/llama-extract
            else
              tar -xzf "/tmp/$ASSET_NAME" -C /tmp/llama-extract
            fi
            find /tmp/llama-extract -type f \( -name "llama-agent" -o -name "*.so*" \) -exec cp -P {} "$HOME/.local/bin/" \;
            chmod +x "$HOME/.local/bin/llama-agent"
            rm -rf /tmp/llama-extract "/tmp/$ASSET_NAME"
          fi

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$HOME/.local/bin:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$HOME/.local/bin/llama-agent" --version

      - name: Restore Actions cache for GGUF model
        id: cache-model
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/llama.cpp
          key: gguf-model-${{ inputs.model_choice }}-${{ steps.model.outputs.file }}-v1

      - name: Restore or seed selected GGUF model (${{ inputs.model_choice }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODEL_ID="${{ inputs.model_choice }}"
          MODEL_FILE="${{ steps.model.outputs.file }}"
          MODEL_REPO="${{ steps.model.outputs.repo }}"
          MODEL_PATH="$HOME/.cache/llama.cpp/$MODEL_FILE"
          mkdir -p "$HOME/.cache/llama.cpp" /tmp/model-parts

          if [ ! -s "$MODEL_PATH" ]; then
            if ! gh release download "$MODEL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MODEL_ID.gguf.part*" --dir /tmp/model-parts 2>/dev/null; then
              echo "Downloading $MODEL_FILE from Hugging Face ($MODEL_REPO)..."
              curl -fsSL "https://huggingface.co" -o "$MODEL_PATH"
              split -b 1900M -d -a 2 "$MODEL_PATH" "/tmp/model-parts/$MODEL_ID.gguf.part"
              gh release upload "$MODEL_RELEASE_TAG" /tmp/model-parts/$MODEL_ID.gguf.part* --repo "$GITHUB_REPOSITORY" --clobber || true
            else
              cat /tmp/model-parts/$MODEL_ID.gguf.part* > "$MODEL_PATH"
            fi
            rm -rf /tmp/model-parts
          fi

          echo "MODEL_PATH=$MODEL_PATH" >> "$GITHUB_ENV"

      - name: Restore incremental checkpoints & ccache from Release (${{ env.DEPS_RELEASE_TAG }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$PREBUILT_PREFIX/bin" "$PREBUILT_PREFIX/lib" "$CCACHE_DIR" /tmp/dep-restore
          KEY_PREFIX="${{ steps.model.outputs.key_prefix }}"

          if ! gh release view "$DEPS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$DEPS_RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Incremental Full LLVM + Clang + LLD + LLDB + Runtimes" \
              --notes "Prebuilt Linux, Windows MSVC, Android NDK, and macOS Darwin LLVM toolchain + sanitizer runtimes (x86 & ARM)." \
              --prerelease
          fi

          if gh release download "$DEPS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "${KEY_PREFIX}-checkpoint.tar.gz" --dir /tmp/dep-restore 2>/dev/null; then
            tar -xzf "/tmp/dep-restore/${KEY_PREFIX}-checkpoint.tar.gz" -C /
            echo "Restored checkpoint for '$KEY_PREFIX':"
            ls -lh "$PREBUILT_PREFIX/lib" | head -n 25 || true
          else
            echo "No prior checkpoint found for '$KEY_PREFIX' — starting fresh."
          fi

          PREV_LIBS=$(find "$PREBUILT_PREFIX/lib" -type f \( -name "*.a" -o -name "*.lib" -o -name "*.so*" -o -name "*.dll" -o -name "*.dylib" \) 2>/dev/null | wc -l)
          PREV_CCACHE=$(ccache -s 2>/dev/null | awk '/files in cache/ {print $NF+0}' | tail -n 1)
          echo "PREV_LIBS=${PREV_LIBS:-0}" >> "$GITHUB_ENV"
          echo "PREV_CCACHE=${PREV_CCACHE:-0}" >> "$GITHUB_ENV"

      - name: Install incremental target-by-target builder helper
        run: |
          sudo tee /usr/local/bin/build-incremental.sh >/dev/null << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          BUILD_DIR="${1:?Usage: build-incremental.sh <build_dir> <root_target_1> [root_target_2 ...]}"
          shift
          ROOT_TARGETS=("$@")

          SOFT_LIMIT_SEC=2100   # 35 minutes (leaves 20m buffer inside 55m job)
          START_TS=$(date +%s)
          mkdir -p "$PREBUILT_PREFIX/bin" "$PREBUILT_PREFIX/lib" /tmp/inc-status
          echo "false" > /tmp/inc-status/done

          # 1. Build & cache host TableGen tools (llvm-tblgen, clang-tblgen, lldb-tblgen) first
          for tbl in llvm-tblgen clang-tblgen lldb-tblgen; do
            if [ -x "$PREBUILT_PREFIX/bin/$tbl" ]; then
              mkdir -p "$BUILD_DIR/bin" "$BUILD_DIR/NATIVE/bin"
              cp "$PREBUILT_PREFIX/bin/$tbl" "$BUILD_DIR/bin/" 2>/dev/null || true
              cp "$PREBUILT_PREFIX/bin/$tbl" "$BUILD_DIR/NATIVE/bin/" 2>/dev/null || true
            elif ninja -C "$BUILD_DIR" -t targets all 2>/dev/null | grep -qE "^(NATIVE/bin/${tbl}|${tbl}):"; then
              echo "=== Building & caching host $tbl ==="
              if ninja -C "$BUILD_DIR" -t targets all 2>/dev/null | grep -q "^NATIVE/bin/${tbl}:"; then
                cmake --build "$BUILD_DIR" --target "NATIVE/bin/${tbl}"
                cp "$BUILD_DIR/NATIVE/bin/${tbl}" "$PREBUILT_PREFIX/bin/"
              else
                cmake --build "$BUILD_DIR" --target "$tbl"
                cp "$BUILD_DIR/bin/${tbl}" "$PREBUILT_PREFIX/bin/"
              fi
            fi
          done

          # 2. Extract transitive LLVM, Clang, LLD & LLDB library targets in topological order
          TARGETS=$(ninja -C "$BUILD_DIR" -t inputs "${ROOT_TARGETS[@]}" | grep -oE 'lib/(lib)?[A-Za-z0-9_+-]+\.(a|so|lib|dylib)' | sed -E 's|^lib/(lib)?||; s|\.(a|so|lib|dylib)$||' | awk '!seen[$0]++')

          TOTAL=$(printf '%s\n' "$TARGETS" | grep -c . || true)
          echo "Topological dependency queue ($TOTAL LLVM/Clang/LLD/LLDB libraries)"

          for target in $TARGETS; do
            if ls "$PREBUILT_PREFIX/lib/lib${target}."* "$PREBUILT_PREFIX/lib/${target}.lib" >/dev/null 2>&1; then
              echo "[SKIP cached] $target"
              continue
            fi

            ELAPSED=$(( $(date +%s) - START_TS ))
            if [ "$ELAPSED" -ge "$SOFT_LIMIT_SEC" ]; then
              echo "[PAUSE] Soft budget reached (${ELAPSED}s >= ${SOFT_LIMIT_SEC}s). Resuming in next slice."
              exit 0
            fi

            REMAINING=$(( 2520 - ELAPSED )) # 42m hard ceiling
            [ "$REMAINING" -gt 900 ] && CAP=900 || CAP="$REMAINING"

            echo "=== [BUILD] $target (elapsed: ${ELAPSED}s, cap: ${CAP}s) ==="
            if timeout --signal=TERM --kill-after=30s "${CAP}s" cmake --build "$BUILD_DIR" --target "$target"; then
              cp -P "$BUILD_DIR/lib/lib${target}."* "$PREBUILT_PREFIX/lib/" 2>/dev/null || true
              cp -P "$BUILD_DIR/lib/${target}.lib" "$PREBUILT_PREFIX/lib/" 2>/dev/null || true
              find "$BUILD_DIR" -type d -name "${target}.dir" -exec rm -rf {} + 2>/dev/null || true
            else
              echo "[TIMEOUT/ERROR] Target $target interrupted — partial .o/.obj files saved in ccache."
              exit 1
            fi
          done

          # 3. Build & install Compiler-RT (ASan, UBSan, TSan, MSan, LSan, profile, builtins) + C++ runtimes
          if [ ! -f "$PREBUILT_PREFIX/.runtimes-done" ]; then
            ELAPSED=$(( $(date +%s) - START_TS ))
            if [ "$ELAPSED" -ge "$SOFT_LIMIT_SEC" ]; then
              echo "[PAUSE] Soft budget reached before runtimes — resuming in next slice."
              exit 0
            fi
            REMAINING=$(( 2520 - ELAPSED ))
            echo "=== [BUILD] Compiler-RT (ASan/UBSan/TSan/Builtins) & Runtimes (cap: ${REMAINING}s) ==="
            if timeout --signal=TERM --kill-after=30s "${REMAINING}s" cmake --build "$BUILD_DIR" --target runtimes install-runtimes; then
              touch "$PREBUILT_PREFIX/.runtimes-done"
            else
              echo "[TIMEOUT/ERROR] Runtimes interrupted — partial objects saved in ccache."
              exit 1
            fi
          fi

          echo "true" > /tmp/inc-status/done
          echo "=== All $TOTAL libraries + Compiler-RT/ASan runtimes built and cached! ==="
          EOF
          sudo chmod +x /usr/local/bin/build-incremental.sh

      - name: Run llama-agent full LLVM + Clang + LLD + LLDB + Runtimes build (${{ matrix.suite_id }} — Slice ${{ inputs.slice }}/${{ inputs.max_slices }})
        id: run-agent
        continue-on-error: true
        env:
          USER_PROMPT: ${{ inputs.custom_prompt }}
          TARGET_OS: ${{ matrix.target_os }}
          TARGET_ARCH: ${{ matrix.arch }}
          ANDROID_API: ${{ inputs.android_api }}
          LLVM_TAG: ${{ inputs.llvm_tag }}
          LLVM_TARGETS: ${{ inputs.llvm_targets }}
        run: |
          set -o pipefail

          if [ "$TARGET_OS" = "windows-xwin" ]; then
            CMAKE_EXTRA_FLAGS="-DCMAKE_TOOLCHAIN_FILE=/tmp/windows-msvc-toolchain.cmake -DCROSS_TOOLCHAIN_FLAGS_NATIVE=-DCMAKE_C_COMPILER=/usr/local/bin/clang;-DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ -DLLVM_ENABLE_RUNTIMES=compiler-rt -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_SANITIZERS=ON -DCOMPILER_RT_BUILD_PROFILE=ON -DLLDB_ENABLE_PYTHON=OFF -DLLDB_ENABLE_LIBXML2=OFF"
          elif [ "$TARGET_OS" = "linux-arm" ]; then
            CMAKE_EXTRA_FLAGS="-DCMAKE_TOOLCHAIN_FILE=/tmp/linux-arm-toolchain.cmake -DCROSS_TOOLCHAIN_FLAGS_NATIVE=-DCMAKE_C_COMPILER=/usr/local/bin/clang;-DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ -DLLVM_ENABLE_RUNTIMES=compiler-rt -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_SANITIZERS=ON -DCOMPILER_RT_BUILD_PROFILE=ON -DLLDB_ENABLE_PYTHON=OFF -DLLDB_ENABLE_LIBXML2=OFF"
          elif [ "$TARGET_OS" = "android-ndk" ]; then
            CMAKE_EXTRA_FLAGS="-DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ARCH -DANDROID_PLATFORM=android-$ANDROID_API -DANDROID_STL=c++_shared -DCROSS_TOOLCHAIN_FLAGS_NATIVE=-DCMAKE_C_COMPILER=/usr/local/bin/clang;-DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ -DLLVM_ENABLE_RUNTIMES=compiler-rt -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_SANITIZERS=ON -DCOMPILER_RT_BUILD_PROFILE=ON -DLLDB_ENABLE_PYTHON=OFF -DLLDB_ENABLE_LIBXML2=OFF"
          elif [ "$TARGET_OS" = "macos" ]; then
            CMAKE_EXTRA_FLAGS="-DCMAKE_TOOLCHAIN_FILE=/tmp/macos-darwin-toolchain.cmake -DCROSS_TOOLCHAIN_FLAGS_NATIVE=-DCMAKE_C_COMPILER=/usr/local/bin/clang;-DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ -DLLVM_ENABLE_RUNTIMES=compiler-rt -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_SANITIZERS=ON -DCOMPILER_RT_BUILD_PROFILE=ON -DCOMPILER_RT_ENABLE_IOS=OFF -DCOMPILER_RT_ENABLE_WATCHOS=OFF -DCOMPILER_RT_ENABLE_TVOS=OFF -DLLDB_ENABLE_PYTHON=OFF -DLLDB_ENABLE_LIBXML2=OFF -DLLDB_USE_SYSTEM_DEBUGSERVER=ON"
          else
            CMAKE_EXTRA_FLAGS="-DCMAKE_C_COMPILER=/usr/local/bin/clang -DCMAKE_CXX_COMPILER=/usr/local/bin/clang++ -DLLVM_USE_LINKER=lld -DLLVM_ENABLE_RUNTIMES=compiler-rt;libcxx;libcxxabi;libunwind -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_SANITIZERS=ON -DCOMPILER_RT_BUILD_PROFILE=ON"
          fi

          if [ -n "$USER_PROMPT" ]; then
            FINAL_PROMPT="$USER_PROMPT"
          else
            FINAL_PROMPT=$(cat << EOF
          Build the complete LLVM + Clang + LLD + LLDB + Compiler-RT (ASan/UBSan/TSan/Builtins) library and header suite incrementally into $PREBUILT_PREFIX (target OS: $TARGET_OS, arch: $TARGET_ARCH):
          1. If /tmp/llvm-src does not exist, run: git clone --depth 1 --branch $LLVM_TAG https://github.com /tmp/llvm-src
          2. Configure the full toolchain with CMake + Ninja + ccache into /tmp/llvm-build:
             cmake -S /tmp/llvm-src/llvm -B /tmp/llvm-build -G Ninja -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA_FLAGS -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_INSTALL_PREFIX=$PREBUILT_PREFIX -DLLVM_ENABLE_PROJECTS="clang;lld;lldb" -DLLVM_TARGETS_TO_BUILD="$LLVM_TARGETS" -DLLVM_BUILD_TOOLS=OFF -DLLVM_INCLUDE_TOOLS=OFF -DLLVM_INCLUDE_UTILS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DCLANG_BUILD_TOOLS=OFF -DCLANG_INCLUDE_TESTS=OFF -DCLANG_INCLUDE_DOCS=OFF -DLLD_BUILD_TOOLS=OFF -DLLDB_INCLUDE_TESTS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_TERMINFO=OFF
          3. Run the topological incremental builder across all LLVM, Clang, LLD, LLDB, and Compiler-RT libraries:
             /usr/local/bin/build-incremental.sh /tmp/llvm-build llvm-libraries clang-libraries lld-libraries liblldb
          4. If any compiler or CMake error occurs, diagnose and fix it, then re-run /usr/local/bin/build-incremental.sh.
          5. If /tmp/inc-status/done contains "true", install all headers and CMake package exports via:
             cmake --build /tmp/llvm-build --target install-llvm-headers install-clang-headers install-lld-headers install-lldb-headers install-cmake-exports install-clang-cmake-exports install-lld-cmake-exports
          EOF
          )
          fi

          printf '%s\n' "$FINAL_PROMPT" | /usr/bin/time -f "%M" -o /tmp/agent-mem-kb.txt \
            timeout --signal=TERM --kill-after=30s 43m \
            "$HOME/.local/bin/llama-agent" \
            --backend local \
            --offline \
            --yolo \
            --no-session \
            --max-iterations 35 \
            --jinja \
            -m "$MODEL_PATH" \
            --threads 4 \
            --ctx-size "${{ steps.model.outputs.ctx }}" \
            -n 8192 \
            2>&1 | tee "inc-agent-${{ matrix.suite_id }}-slice-${{ inputs.slice }}.log"

      - name: Upload checkpoint & auto-dispatch next slice for ${{ matrix.suite_id }} if needed
        id: checkpoint
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUITE_ID="${{ matrix.suite_id }}"
          KEY_PREFIX="${{ steps.model.outputs.key_prefix }}"
          SLICE="${{ inputs.slice }}"
          MAX_SLICES="${{ inputs.max_slices }}"
          ALL_DONE=$(cat /tmp/inc-status/done 2>/dev/null || echo "false")

          CUR_LIBS=$(find "$PREBUILT_PREFIX/lib" -type f \( -name "*.a" -o -name "*.lib" -o -name "*.so*" -o -name "*.dll" -o -name "*.dylib" \) 2>/dev/null | wc -l)
          CUR_CCACHE=$(ccache -s 2>/dev/null | awk '/files in cache/ {print $NF+0}' | tail -n 1)
          NEW_LIBS=$(( ${CUR_LIBS:-0} - ${PREV_LIBS:-0} ))
          NEW_OBJS=$(( ${CUR_CCACHE:-0} - ${PREV_CCACHE:-0} ))

          tar -czf "/tmp/${KEY_PREFIX}-checkpoint.tar.gz" "$PREBUILT_PREFIX" "$CCACHE_DIR" 2>/dev/null || true
          if [ -s "/tmp/${KEY_PREFIX}-checkpoint.tar.gz" ]; then
            gh release upload "$DEPS_RELEASE_TAG" "/tmp/${KEY_PREFIX}-checkpoint.tar.gz" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi

          if [ "$ALL_DONE" = "true" ]; then
            tar -czf "/tmp/${KEY_PREFIX}-prebuilt.tar.gz" -C "$PREBUILT_PREFIX" .
            gh release upload "$DEPS_RELEASE_TAG" "/tmp/${KEY_PREFIX}-prebuilt.tar.gz" \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi

          {
            echo "## Incremental Full LLVM + Clang + LLD + LLDB + Runtimes — \`$SUITE_ID\` (Slice $SLICE / $MAX_SLICES)"
            echo "- **Architectures:** \`${{ inputs.llvm_targets }}\` | **Model:** \`${{ inputs.model_choice }}\` | **Completed:** \`$ALL_DONE\`"
            echo "- **Cached Libraries & Runtimes:** \`$CUR_LIBS\` total (+\`$NEW_LIBS\` this slice)"
            echo "- **CCache Objects:** \`${CUR_CCACHE:-0}\` total (+\`$NEW_OBJS\` this slice)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ALL_DONE" = "true" ]; then
            echo "Build 100% complete for $SUITE_ID! Published ${KEY_PREFIX}-prebuilt.tar.gz to $DEPS_RELEASE_TAG."
            exit 0
          fi

          if [ "$NEW_LIBS" -le 0 ] && [ "$NEW_OBJS" -le 0 ]; then
            echo "ERROR: Zero forward progress for $SUITE_ID in slice $SLICE (0 new libs, 0 new ccache objects) — aborting to prevent infinite loop."
            exit 1
          fi

          if [ "$SLICE" -ge "$MAX_SLICES" ]; then
            echo "ERROR: Reached MAX_SLICES ($MAX_SLICES) for $SUITE_ID with $CUR_LIBS libraries cached — stopping."
            exit 1
          fi

          NEXT_SLICE=$((SLICE + 1))
          echo "Progress verified for $SUITE_ID (+$NEW_LIBS libs, +$NEW_OBJS ccache objs). Dispatching slice $NEXT_SLICE..."
          gh workflow run "llvm-clang-toolchain.yaml" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f model_choice="${{ inputs.model_choice }}" \
            -f target_suite="$SUITE_ID" \
            -f android_api="${{ inputs.android_api }}" \
            -f ndk_version="${{ inputs.ndk_version }}" \
            -f llvm_tag="${{ inputs.llvm_tag }}" \
            -f llvm_targets="${{ inputs.llvm_targets }}" \
            -f custom_prompt="${{ inputs.custom_prompt }}" \
            -f slice="$NEXT_SLICE" \
            -f max_slices="$MAX_SLICES"

  # Job 2A: Linux verification across x86_64, arm64 (QEMU), and armhf (QEMU)
  verify-linux:
    needs: incremental-build
    if: always() && needs.incremental-build.result == 'success' && (inputs.target_suite == 'all' || inputs.target_suite == 'linux-all' || startsWith(inputs.target_suite, 'linux-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite_id: linux-x86_64
            arch: x86_64
            triple: x86_64-linux-gnu
            qemu: ''
          - suite_id: linux-arm64
            arch: aarch64
            triple: aarch64-linux-gnu
            qemu: qemu-aarch64-static
          - suite_id: linux-armhf
            arch: armhf
            triple: arm-linux-gnueabihf
            qemu: qemu-arm-static

    steps:
      - name: Check if ${{ matrix.suite_id }} prebuilt release asset is published
        id: check-asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "$DEPS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qx "llvm-suite-full-${{ matrix.suite_id }}-prebuilt.tar.gz"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Clang 22, ARM cross-sysroots & QEMU user-mode emulator (for ARM tests)
        if: steps.check-asset.outputs.ready == 'true'
        run: |
          curl -fsSL https://llvm.org | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://llvm.org llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user-static

      - name: Download prebuilt ${{ matrix.suite_id }} archive & execute CTest (native or via QEMU)
        if: steps.check-asset.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$PREBUILT_PREFIX" /tmp/linux-smoke
          gh release download "$DEPS_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "llvm-suite-full-${{ matrix.suite_id }}-prebuilt.tar.gz" \
            --dir /tmp
          tar -xzf "/tmp/llvm-suite-full-${{ matrix.suite_id }}-prebuilt.tar.gz" -C "$PREBUILT_PREFIX"

          cat << 'EOF' > /tmp/linux-smoke/CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(linux_llvm_suite_smoke LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(LLVM REQUIRED CONFIG)
          find_package(Clang REQUIRED CONFIG)
          find_package(LLD REQUIRED CONFIG)
          llvm_map_components_to_libnames(LLVM_LIBS
            Support MC MCDisassembler
            X86Disassembler X86Desc X86Info
            ARMDisassembler ARMDesc ARMInfo
            AArch64Disassembler AArch64Desc AArch64Info
            MipsDisassembler MipsDesc MipsInfo
          )
          add_executable(smoke main.cpp)
          target_include_directories(smoke PRIVATE ${LLVM_INCLUDE_DIRS} ${CLANG_INCLUDE_DIRS} ${LLD_INCLUDE_DIRS})
          target_compile_definitions(smoke PRIVATE ${LLVM_DEFINITIONS})
          target_link_libraries(smoke PRIVATE ${LLVM_LIBS} clangBasic lldCommon)
          EOF

          cat << 'EOF' > /tmp/linux-smoke/main.cpp
          #include <iostream>
          #include "llvm/Support/TargetSelect.h"
          #include "clang/Basic/Version.h"
          int main() {
              llvm::InitializeAllTargetInfos();
              llvm::InitializeAllTargetMCs();
              llvm::InitializeAllDisassemblers();
              std::cout << "Linux (${{ matrix.suite_id }}) LLVM (X86/ARM/AArch64/Mips) + " << clang::getClangFullVersion() << " executed cleanly!\n";
              return 0;
          }
          EOF

          EXTRA_CMAKE=""
          if [ -n "${{ matrix.qemu }}" ]; then
            EXTRA_CMAKE="-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} -DCMAKE_C_COMPILER_TARGET=${{ matrix.triple }} -DCMAKE_CXX_COMPILER_TARGET=${{ matrix.triple }} -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_FIND_ROOT_PATH=/usr/${{ matrix.triple }};$PREBUILT_PREFIX"
          fi

          cmake -S /tmp/linux-smoke -B /tmp/linux-smoke/build -G Ninja \
            -DCMAKE_C_COMPILER=clang-22 \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREBUILT_PREFIX" \
            $EXTRA_CMAKE
          cmake --build /tmp/linux-smoke/build
          file /tmp/linux-smoke/build/smoke
          if [ -n "${{ matrix.qemu }}" ]; then
            ${{ matrix.qemu }} -L "/usr/${{ matrix.triple }}" /tmp/linux-smoke/build/smoke
          else
            /tmp/linux-smoke/build/smoke
          fi

  # Job 2B: Native Windows verification across x86_64 (windows-latest) and ARM64 (windows-11-arm)
  verify-windows:
    needs: incremental-build
    if: always() && needs.incremental-build.result == 'success' && (inputs.target_suite == 'all' || inputs.target_suite == 'windows-all' || startsWith(inputs.target_suite, 'windows-'))
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite_id: windows-x86_64
            runner: windows-latest
          - suite_id: windows-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check if ${{ matrix.suite_id }} prebuilt release asset is published
        id: check-asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = gh release view "${{ env.DEPS_RELEASE_TAG }}" --repo "${{ github.repository }}" --json assets -q ".assets[].name" 2>$null
          if ($assets -contains "llvm-suite-full-${{ matrix.suite_id }}-prebuilt.tar.gz") {
            echo "ready=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "ready=false" >> $env:GITHUB_OUTPUT
          }

      - name: Exclude cache & build folders from Windows Defender
        if: steps.check-asset.outputs.ready == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:/Users/runneradmin/.cache/prebuilt-deps" | Out-Null
          Add-MpPreference -ExclusionPath "C:\Users\runneradmin\.cache"
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Download cross-compiled Windows ${{ matrix.suite_id }} archive from Release
        if: steps.check-asset.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download "${{ env.DEPS_RELEASE_TAG }}" `
            --repo "${{ github.repository }}" `
            --pattern "llvm-suite-full-${{ matrix.suite_id }}-prebuilt.tar.gz" `
            --dir C:/Users/runneradmin/.cache
          tar -xzf "C:/Users/runneradmin/.cache/llvm-suite-full-${{ matrix.suite_id }}-prebuilt.tar.gz" -C C:/Users/runneradmin/.cache/prebuilt-deps

      - name: Run native Windows (${{ matrix.suite_id }}) clang-cl + LLD + CTest smoke test
        if: steps.check-asset.outputs.ready == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:/win-smoke-test | Out-Null
          @'
          cmake_minimum_required(VERSION 3.20)
          project(win_llvm_suite_smoke LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(LLVM REQUIRED CONFIG)
          find_package(Clang REQUIRED CONFIG)
          find_package(LLD REQUIRED CONFIG)
          llvm_map_components_to_libnames(LLVM_LIBS
            Support MC MCDisassembler
            X86Disassembler X86Desc X86Info
            ARMDisassembler ARMDesc ARMInfo
            AArch64Disassembler AArch64Desc AArch64Info
            MipsDisassembler MipsDesc MipsInfo
          )
          add_executable(smoke main.cpp)
          target_include_directories(smoke PRIVATE ${LLVM_INCLUDE_DIRS} ${CLANG_INCLUDE_DIRS} ${LLD_INCLUDE_DIRS})
          target_compile_definitions(smoke PRIVATE ${LLVM_DEFINITIONS})
          target_link_libraries(smoke PRIVATE ${LLVM_LIBS} clangBasic lldCommon)
          enable_testing()
          add_test(NAME WinSmokeTest COMMAND smoke)
          '@ | Set-Content -Path C:/win-smoke-test/CMakeLists.txt

          @'
          #include <iostream>
          #include "llvm/Support/TargetSelect.h"
          #include "clang/Basic/Version.h"
          int main() {
              llvm::InitializeAllTargetInfos();
              llvm::InitializeAllTargetMCs();
              llvm::InitializeAllDisassemblers();
              std::cout << "Windows (${{ matrix.suite_id }}) LLVM (X86/ARM/AArch64/Mips) + " << clang::getClangFullVersion() << " executed cleanly!\n";
              return 0;
          }
          '@ | Set-Content -Path C:/win-smoke-test/main.cpp

          cmake -S C:/win-smoke-test -B C:/win-smoke-test/build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_LINKER=lld-link `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="C:/Users/runneradmin/.cache/prebuilt-deps"
          cmake --build C:/win-smoke-test/build
          ctest --test-dir C:/win-smoke-test/build --output-on-failure

  # Job 2C: Android NDK verification across all 4 ABIs
  verify-android:
    needs: incremental-build
    if: always() && needs.incremental-build.result == 'success' && (inputs.target_suite == 'all' || inputs.target_suite == 'android-all' || startsWith(inputs.target_suite, 'android-'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    steps:
      - name: Check if Android ${{ matrix.abi }} prebuilt release asset is published
        id: check-asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "$DEPS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qx "llvm-suite-full-android-${{ matrix.abi }}-prebuilt.tar.gz"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore Android NDK cache
        if: steps.check-asset.outputs.ready == 'true'
        uses: actions/cache@v5
        with:
          path: /home/runner/.cache/android-ndk
          key: android-ndk-${{ inputs.ndk_version }}-linux-v1

      - name: Download prebuilt Android ${{ matrix.abi }} LLVM suite archive from Release
        if: steps.check-asset.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$PREBUILT_PREFIX" /tmp/android-smoke
          gh release download "$DEPS_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "llvm-suite-full-android-${{ matrix.abi }}-prebuilt.tar.gz" \
            --dir /tmp
          tar -xzf "/tmp/llvm-suite-full-android-${{ matrix.abi }}-prebuilt.tar.gz" -C "$PREBUILT_PREFIX"

      - name: Cross-compile & link Android ${{ matrix.abi }} smoke binary
        if: steps.check-asset.outputs.ready == 'true'
        run: |
          cat << 'EOF' > /tmp/android-smoke/CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(android_llvm_suite_smoke LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(LLVM REQUIRED CONFIG)
          find_package(Clang REQUIRED CONFIG)
          find_package(LLD REQUIRED CONFIG)
          llvm_map_components_to_libnames(LLVM_LIBS
            Support MC MCDisassembler
            X86Disassembler X86Desc X86Info
            ARMDisassembler ARMDesc ARMInfo
            AArch64Disassembler AArch64Desc AArch64Info
            MipsDisassembler MipsDesc MipsInfo
          )
          add_executable(smoke main.cpp)
          target_include_directories(smoke PRIVATE ${LLVM_INCLUDE_DIRS} ${CLANG_INCLUDE_DIRS} ${LLD_INCLUDE_DIRS})
          target_compile_definitions(smoke PRIVATE ${LLVM_DEFINITIONS})
          target_link_libraries(smoke PRIVATE ${LLVM_LIBS} clangBasic lldCommon)
          EOF

          cat << 'EOF' > /tmp/android-smoke/main.cpp
          #include <iostream>
          #include "llvm/Support/TargetSelect.h"
          #include "clang/Basic/Version.h"
          int main() {
              llvm::InitializeAllTargetInfos();
              llvm::InitializeAllTargetMCs();
              llvm::InitializeAllDisassemblers();
              std::cout << "Android LLVM (X86/ARM/AArch64/Mips) + " << clang::getClangFullVersion() << "\n";
              return 0;
          }
          EOF

          cmake -S /tmp/android-smoke -B /tmp/android-smoke/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ inputs.android_api }}" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH="$PREBUILT_PREFIX" \
            -DCMAKE_PREFIX_PATH="$PREBUILT_PREFIX"
          cmake --build /tmp/android-smoke/build
          file /tmp/android-smoke/build/smoke

  # Job 2D: Native macOS verification across arm64 and x86_64 on macos-latest
  verify-macos:
    needs: incremental-build
    if: always() && needs.incremental-build.result == 'success' && (inputs.target_suite == 'all' || inputs.target_suite == 'macos-all' || startsWith(inputs.target_suite, 'macos-'))
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - name: Check if macOS ${{ matrix.arch }} prebuilt release asset is published
        id: check-asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=$(gh release view "$DEPS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qx "llvm-suite-full-macos-${{ matrix.arch }}-prebuilt.tar.gz"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ninja if missing
        if: steps.check-asset.outputs.ready == 'true'
        run: command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Download cross-compiled macOS ${{ matrix.arch }} LLVM suite archive from Release
        if: steps.check-asset.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /Users/runner/.cache/prebuilt-deps /tmp/macos-smoke
          gh release download "$DEPS_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "llvm-suite-full-macos-${{ matrix.arch }}-prebuilt.tar.gz" \
            --dir /tmp
          tar -xzf "/tmp/llvm-suite-full-macos-${{ matrix.arch }}-prebuilt.tar.gz" -C /Users/runner/.cache/prebuilt-deps

      - name: Compile, link & run native macOS ${{ matrix.arch }} CTest smoke binary
        if: steps.check-asset.outputs.ready == 'true'
        run: |
          cat << 'EOF' > /tmp/macos-smoke/CMakeLists.txt
          cmake_minimum_required(VERSION 3.20)
          project(macos_llvm_suite_smoke LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(LLVM REQUIRED CONFIG)
          find_package(Clang REQUIRED CONFIG)
          find_package(LLD REQUIRED CONFIG)
          llvm_map_components_to_libnames(LLVM_LIBS
            Support MC MCDisassembler
            X86Disassembler X86Desc X86Info
            ARMDisassembler ARMDesc ARMInfo
            AArch64Disassembler AArch64Desc AArch64Info
            MipsDisassembler MipsDesc MipsInfo
          )
          add_executable(smoke main.cpp)
          target_include_directories(smoke PRIVATE ${LLVM_INCLUDE_DIRS} ${CLANG_INCLUDE_DIRS} ${LLD_INCLUDE_DIRS})
          target_compile_definitions(smoke PRIVATE ${LLVM_DEFINITIONS})
          target_link_libraries(smoke PRIVATE ${LLVM_LIBS} clangBasic lldCommon)
          enable_testing()
          add_test(NAME MacOSSmokeTest COMMAND smoke)
          EOF

          cat << 'EOF' > /tmp/macos-smoke/main.cpp
          #include <iostream>
          #include "llvm/Support/TargetSelect.h"
          #include "clang/Basic/Version.h"
          int main() {
              llvm::InitializeAllTargetInfos();
              llvm::InitializeAllTargetMCs();
              llvm::InitializeAllDisassemblers();
              std::cout << "macOS native (${{ matrix.arch }}) LLVM (X86/ARM/AArch64/Mips) + " << clang::getClangFullVersion() << " executed cleanly!\n";
              return 0;
          }
          EOF

          cmake -S /tmp/macos-smoke -B /tmp/macos-smoke/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_PREFIX_PATH="/Users/runner/.cache/prebuilt-deps"
          cmake --build /tmp/macos-smoke/build
          file /tmp/macos-smoke/build/smoke
          ctest --test-dir /tmp/macos-smoke/build --output-on-failure
